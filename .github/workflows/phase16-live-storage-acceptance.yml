name: Phase 16 LIVE IDrive storage acceptance (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase16-live-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lucia_phase16_acceptance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_phase16_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d lucia_phase16_acceptance'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ephemeral_phase16_only@127.0.0.1:5432/lucia_phase16_acceptance
      WEBSITE_TEST_ADMIN_URL: postgres://postgres:ephemeral_phase16_only@127.0.0.1:5432/lucia_phase16_acceptance
      WEBSITE_TEST_RUNTIME_URL: postgres://lucia_acceptance_runtime:isolated_runtime_only@127.0.0.1:5432/lucia_phase16_acceptance
      S3_ENDPOINT: https://s3.eu-west-3.idrivee2.com
      S3_REGION: eu-west-3
      S3_BUCKET: lucia-os-customer-media-2026
      MEDIA_UPLOADS_ENABLED: '1'
      MEDIA_WEBSITE_QUOTA_BYTES: '5000000'
      MEDIA_PRODUCT_BUDGET_BYTES: '2000000000'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Refuse production branch
        run: |
          test "$GITHUB_REF_NAME" = 'phase-16-premium-personalization-studio'
      - name: Checkout selected branch without token persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Required restricted IDrive secrets preflight
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.PHASE16_IDRIVE_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PHASE16_IDRIVE_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$S3_ACCESS_KEY_ID" ] || [ -z "$S3_SECRET_ACCESS_KEY" ]; then
            echo '::error::Configure PHASE16_IDRIVE_ACCESS_KEY_ID and PHASE16_IDRIVE_SECRET_ACCESS_KEY as GitHub Actions secrets; the Vercel variables are not accessible to Actions.'
            exit 1
          fi
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Apply migrations to ephemeral PostgreSQL
        run: npm run db:migrate
      - name: Create NOBYPASSRLS test runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lucia_acceptance_runtime LOGIN PASSWORD 'isolated_runtime_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE lucia_phase16_acceptance TO lucia_acceptance_runtime;
          GRANT USAGE ON SCHEMA public TO lucia_acceptance_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO lucia_acceptance_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO lucia_acceptance_runtime;
          GRANT EXECUTE ON FUNCTION public.lucia_public_media(uuid) TO lucia_acceptance_runtime;
          SQL
      - name: Build actual application
        run: npm run build
      - name: Install isolated browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise real application against IDrive
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.PHASE16_IDRIVE_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PHASE16_IDRIVE_SECRET_ACCESS_KEY }}
        run: node scripts/phase16-live-storage-acceptance.mjs
      - name: Upload safe acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-live-idrive-acceptance
          path: artifacts/phase16-live-storage/
          retention-days: 7
          if-no-files-found: warn
