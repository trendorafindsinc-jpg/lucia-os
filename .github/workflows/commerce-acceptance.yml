name: Commerce acceptance
on:
  pull_request:
    paths:
      - "src/lib/commerce/**"
      - "src/app/api/commerce/**"
      - "src/components/commerce/**"
      - "src/app/checkout/**"
      - "src/middleware.ts"
      - "drizzle/0031_commerce_core.sql"
      - "src/lib/db/schema.ts"
      - ".github/workflows/commerce-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commerce-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commerce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint Commerce implementation
        run: npx eslint src/lib/commerce src/app/api/commerce src/components/commerce src/app/checkout src/middleware.ts
      - name: Commerce unit and payment security tests
        run: npm test -- src/lib/commerce/totals.test.ts src/lib/commerce/paystack-gateway.test.ts src/lib/billing/paystack.test.ts src/lib/billing/verify-transaction.test.ts
