name: Phase 15 scheduled workers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: phase15-scheduled-workers
  cancel-in-progress: false

jobs:
  invoke:
    name: Publish due articles and reconcile customer media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke production workers with a scoped GitHub OIDC token
        uses: actions/github-script@v7
        env:
          LUCIA_OS_BASE_URL: https://os.lucia.name.ng
        with:
          script: |
            const token = await core.getIDToken("lucia-os-phase15-workers");
            const base = process.env.LUCIA_OS_BASE_URL;
            for (const path of ["/api/cron/publish-articles", "/api/cron/reconcile-media"]) {
              const response = await fetch(new URL(path, base), {
                method: "GET",
                headers: { authorization: "Bearer " + token, accept: "application/json" },
                signal: AbortSignal.timeout(120000),
              });
              const body = await response.text();
              if (!response.ok) {
                throw new Error(path + " returned " + response.status + ": " + body.slice(0, 1000));
              }
              core.info(path + " completed: " + body);
            }
